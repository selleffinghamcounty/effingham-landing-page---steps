<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Your Home Fast</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #555;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 16px;
    }
    button {
      background: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Sell Your Home Fast in Effingham</h1>
    <p>Get a free home value and custom selling strategy today.</p>

    <form action="https://formspree.io/f/mdapvabz" method="POST">

      <input type="text" name="name" placeholder="Your Name" required>

      <input type="email" name="email" placeholder="Your Email" required>

      <input type="tel" name="phone" placeholder="Your Phone">

      <!-- Optional but HIGH VALUE -->
      <input type="text" name="property_address" placeholder="Property Address">

      <textarea name="message" placeholder="Anything you'd like me to know?"></textarea>

      <!-- Hidden fields (important) -->
      <input type="hidden" name="_subject" value="New Seller Lead - Landing Page">
      <input type="hidden" name="_source" value="effingham-landing-page">

      <button type="submit">Get My Home Value</button>

    </form>
  </div>

</body>
</html>
